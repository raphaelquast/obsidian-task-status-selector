name: Create Attestations

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: Attest
              uses: actions/attest-build-provenance@v4.2.2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
